<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色 V1 轉場 QA（P4）</title>
<style>
  :root { color-scheme: dark; --bg: #1c1d21; --panel: #26282e; --line: #3a3d46; --text: #e6e7ea; --muted: #9a9eaa; --ok: #6fcf97; --bad: #ff7a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", sans-serif; display: flex; flex-wrap: wrap; }
  #view { flex: 1 1 520px; min-width: 320px; display: flex; align-items: flex-start; justify-content: center; padding: 12px; }
  canvas { width: min(100%, 960px); height: auto; aspect-ratio: 1; background: #77797f; border: 1px solid var(--line); }
  #panel { flex: 0 1 400px; padding: 12px 16px; background: var(--panel); border-left: 1px solid var(--line); min-height: 100vh; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
  p.note { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  label span.name { flex: 0 0 84px; color: var(--muted); }
  input[type=range] { flex: 1; }
  select, button { background: #32353d; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; max-width: 100%; }
  select { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  output { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  #pose { font-size: 12px; color: var(--muted); min-height: 3em; white-space: pre-wrap; }
  #status { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"><canvas id="canvas" width="960" height="960"></canvas></div>
<div id="panel">
  <h1>角色 V1 轉場 QA（P4）</h1>
  <p class="note">層權重只由時間與切換事件決定（scripts/cv1_transition.py 的雙實作）；AnimationMixer 混合 → 著地腳鎖定（scripts/cv1_foot_lock.py 的雙實作）→ socket → 輔助骨 → 修形規則 → 引擎 morph＋skin。這是本 repo 的 Three.js QA 場景，不是遊戲整合。</p>
  <h2>情境</h2>
  <label><span class="name">轉場</span><select id="scenario"></select></label>
  <label><span class="name">時間</span><input id="time" type="range" min="0" max="1" step="0.0001" value="0"><output id="timeOut">0.000 s</output></label>
  <label><span class="name">播放</span><button id="play">播放</button><select id="fps"><option value="30">30 fps</option><option value="60" selected>60 fps</option><option value="120">120 fps</option></select></label>
  <label><span class="name">求值器</span><input id="evaluator" type="checkbox" checked><span>依最終姿勢計算修形</span></label>
  <label><span class="name">腳鎖定</span><input id="footlock" type="checkbox" checked><span>轉場中鎖住著地腳（腿部 IK）</span></label>
  <label><span class="name">鏡頭</span>
    <select id="camera"><option value="whole">全身</option><option value="side">側面</option><option value="hands">雙手</option><option value="feet">雙腳</option></select>
  </label>
  <div id="pose"></div>
  <h2>量測</h2>
  <button id="run">執行 P4 量測並存檔</button>
  <div id="status">載入中…</div>
</div>
<script type="module" src="./src/p4.js"></script>
</body>
</html>
