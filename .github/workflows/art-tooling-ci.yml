name: Art tooling CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Python and Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact revision without LFS downloads
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: false
          set-safe-directory: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install existing numerical test dependency
        run: python -m pip install numpy==2.0.0
      - name: Report runtimes
        run: |
          python --version
          node --version
      - name: Full Python suite (skipped tests fail this gate)
        shell: python
        run: |
          import re
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          print(result.stdout, end='')
          if result.returncode:
              sys.exit(result.returncode)
          if not re.search(r'\nRan [1-9]\d* tests? in ', result.stdout):
              sys.exit('TEST_RESULT_MISSING')
          if not re.search(r'\nOK\s*$', result.stdout):
              sys.exit('SKIPPED_TESTS_ARE_NOT_PASS')
      - name: Node wrapper syntax
        run: node --check tools/art-validation/validate-glb.mjs
      - name: Node wrapper and Windows cross-drive boundaries
        run: python -B -m unittest discover -s tests -p test_art_validator_wrapper.py -v
      - name: Catalog and operation evidence
        run: python -B scripts/pipeline.py validate
      - name: Verify frozen smoke evidence bytes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          base = Path('runs/qa/art-tools-upgrade-20261007')
          capture = json.loads((base / 'capture-v001/capture.json').read_text(encoding='utf-8'))
          protocol = json.loads((base / 'preview-protocol.json').read_text(encoding='utf-8'))
          canonical = json.dumps(protocol, sort_keys=True, ensure_ascii=False, separators=(',', ':'), allow_nan=False).encode('utf-8')
          if hashlib.sha256(canonical).hexdigest() != capture['protocol_sha256']:
              raise SystemExit('PROTOCOL_CANONICAL_DIGEST_MISMATCH')
          print(f"PASS protocol canonical digest: {capture['protocol_sha256']}")
          expected = [
              (Path('scripts/blender_art_preview.py'), capture['script_sha256']),
          ]
          expected += [(base / 'capture-v001' / item['path'], item['sha256']) for item in capture['files']]
          for path, digest in expected:
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'EVIDENCE_HASH_MISMATCH: {path}')
              print(f'PASS {path}: {actual}')
          print('Historical Windows Blender capture only; no remote DCC or art acceptance.')
